<style>
:root{
  color-scheme:light;
  --bg:#f4f8fb; --grid:rgba(31,90,138,.07); --surface:#ffffff; --ink:#1b2a41; --muted:#5d6b7e;
  --line:#d9e3ec; --accent:#1f7a8c; --accent-soft:#dff1f4; --video:#d1495b; --pdf:#e08e0b; --link:#3d5a9e; --img:#2f9e6b; --danger:#c0392b;
  --shadow:0 1px 2px rgba(27,42,65,.06),0 8px 24px rgba(27,42,65,.06);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10202b; --grid:rgba(214,235,245,.06); --surface:#16293a; --ink:#e8f1f6; --muted:#9fb3c2;
    --line:#274156; --accent:#6cc4d4; --accent-soft:#1d3b4c; --video:#ff7a8a; --pdf:#f2b64a; --link:#8fa9e8; --img:#5fd3a0; --danger:#ff8a7a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10202b; --grid:rgba(214,235,245,.06); --surface:#16293a; --ink:#e8f1f6; --muted:#9fb3c2;
  --line:#274156; --accent:#6cc4d4; --accent-soft:#1d3b4c; --video:#ff7a8a; --pdf:#f2b64a; --link:#8fa9e8; --img:#5fd3a0; --danger:#ff8a7a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background-color:var(--bg);color:var(--ink);font-family:"Readex Pro",Tahoma,Arial,sans-serif;line-height:1.7;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;transition:background-color .25s,color .25s}
.sym{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.sym span{position:absolute;font-family:"Cambria Math","Times New Roman",serif;color:var(--accent);opacity:.1;font-size:56px}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:20px 18px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top .r{display:flex;gap:8px}
.brand{font-weight:700;font-size:15px;color:var(--muted)}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;box-shadow:var(--shadow)}
.hero{text-align:center;padding:56px 0 34px}
.hero h1{font-size:clamp(30px,6vw,52px);margin:0 0 10px;font-weight:700;line-height:1.3}
.hero p{margin:0 auto;max-width:460px;color:var(--muted);font-size:17px}
.formula{display:inline-block;margin-top:18px;padding:6px 16px;border:1px dashed var(--line);border-radius:999px;font-family:"Cambria Math","Times New Roman",serif;direction:ltr;color:var(--accent);font-size:17px}
.years{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:20px}
.year{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px 22px;text-align:right;box-shadow:var(--shadow);transition:transform .2s,border-color .2s;display:flex;flex-direction:column;gap:6px}
.year:hover{transform:translateY(-4px);border-color:var(--accent)}
.year .g{font-family:"Cambria Math","Times New Roman",serif;font-size:76px;line-height:1;color:var(--accent);direction:ltr;text-align:right}
.year b{font-size:24px}
.year small{color:var(--muted);font-size:14px}
.back{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-size:15px}
.yhead{display:flex;align-items:center;gap:16px;margin:28px 0 18px}
.yhead .g{font-family:"Cambria Math","Times New Roman",serif;font-size:64px;color:var(--accent);line-height:1}
.yhead h2{margin:0;font-size:32px}
.yhead p{margin:0;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.search,.f{padding:11px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;width:100%}
.search{flex:1;min-width:200px;width:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.weeks{display:flex;gap:8px;overflow-x:auto;padding:8px 0 14px;margin-bottom:6px}
.weeks .chip{white-space:nowrap}
.group h3{margin:26px 0 12px;font-size:19px;display:flex;align-items:center;gap:10px}
.group h3::after{content:"";flex:1;height:1px;background:var(--line)}
.row{display:flex;gap:8px;align-items:stretch;margin-bottom:10px}
.item{flex:1;display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:border-color .2s;text-align:right;min-width:0}
.item:hover{border-color:var(--accent)}
.badge{flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:22px;background:var(--accent-soft)}
.item .t{flex:1;font-weight:600;overflow-wrap:anywhere}
.item .k{font-size:13px;color:var(--muted);font-weight:400}
.item .go{color:var(--accent);font-size:14px;font-weight:600;white-space:nowrap}
.k-video .badge{color:var(--video)} .k-pdf .badge{color:var(--pdf)} .k-link .badge{color:var(--link)} .k-image .badge{color:var(--img)}
.empty{text-align:center;color:var(--muted);padding:40px 10px;border:1px dashed var(--line);border-radius:16px}
.adm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 0;padding:12px 14px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:16px}
.adm b{margin-inline-end:auto}
.btn{padding:9px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.btn.d{color:var(--danger)}
.sq{width:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:16px}
dialog{border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--ink);padding:22px;width:min(480px,92vw);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(8,16,24,.55)}
dialog h4{margin:0 0 14px;font-size:20px}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
.acts{display:flex;gap:8px;margin-top:18px;justify-content:flex-start}
.msg{min-height:22px;font-size:14px;color:var(--danger);margin-top:10px}
#viewer{width:min(900px,96vw)}
#viewer video,#viewer img{width:100%;max-height:75vh;border-radius:12px;background:#000;object-fit:contain}
.note{font-size:13px;color:var(--muted);margin-top:6px}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:40px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:99;font-size:14px;box-shadow:var(--shadow)}
</style>
</head>

  <span style="top:8%;right:6%">π</span><span style="top:22%;left:8%;font-size:80px">∑</span>

  <span style="top:82%;right:30%;font-size:64px">∞</span><span style="top:90%;left:22%">θ</span>

<div class="wrap">
  <div class="top">
    <span class="brand">كلية التربية · شعبة الرياضيات</span>
    <div class="r">
      <button class="icon-btn" id="lock" aria-label="دخول المشرف">🔒</button>
      <button class="icon-btn" id="theme" aria-label="تغيير الوضع بين الفاتح والداكن">🌙</button>

  <div class="adm" id="adm" hidden>
    <b>وضع المشرف</b>

    <button class="btn" id="pwBtn">تغيير الباسورد</button>
    <button class="btn" id="outBtn">خروج</button>
  </div>

  <main id="home">
    <section class="hero">
      <h1>أهلاً بيك في سكاشن الرياضيات</h1>
      <p>اختار سنتك الدراسية وهتلاقي الفيديوهات وملفات الـ PDF واللينكات كلها في مكان واحد.</p>
      <div class="formula">e<sup>iπ</sup> + 1 = 0</div>
    </section>

  </main>

  <main id="year" hidden>
    <button class="back" id="back">← الرجوع لاختيار السنة</button>
    <div class="yhead"><div class="g" id="yg"></div><div><h2 id="yt"></h2><p id="ys"></p></div></div>
    <div class="tools">
      <input class="search" id="q" type="search" placeholder="ابحث عن اسم محاضرة أو ملف..." aria-label="بحث">
      <div class="chips" id="types"></div>
    </div>
    <div class="weeks" id="weeks"></div>
    <div id="list"></div>
  </main>
  <footer>صُنع لطلاب كلية التربية · قسم الرياضيات</footer>
</div>

<dialog id="dLogin">
  <h4>دخول المشرف</h4>
  <div id="lemW"><label for="lem">اسم المستخدم</label><input class="f" id="lem" type="text" dir="ltr" autocomplete="username" autocapitalize="none"></div><label for="lpw">الباسورد</label>

<dialog id="dItem">
  <h4 id="dTitle">إضافة محتوى</h4>
  <label for="iYear">السنة</label>
  <select class="f" id="iYear"></select>
  <label for="iWeek">السكشن (اكتب اسم جديد أو اختار)</label>
  <input class="f" id="iWeek" list="wl" placeholder="مثال: السكشن 3">
  <datalist id="wl"></datalist>
  <label for="iTitle">العنوان</label>
  <input class="f" id="iTitle" placeholder="مثال: شرح التكامل بالتعويض">

    <option value="video">فيديو</option><option value="pdf">ملف PDF</option>

  </select>
  <label for="iUrl">رابط (يوتيوب أو درايف أو أي لينك)</label>
  <input class="f" id="iUrl" dir="ltr" placeholder="https://...">
  <label for="iFile">أو ارفع ملف من جهازك (فيديو أو صورة أو PDF)</label>
  <input class="f" id="iFile" type="file" accept="video/*,image/*,application/pdf">
  <div class="note" id="fnote"></div>
  <div class="msg" id="imsg"></div>
  <div class="acts"><button class="btn p" id="iok">حفظ</button><button class="btn" data-close>إلغاء</button></div>
</dialog>

<dialog id="dPw">
  <h4>تغيير الباسورد</h4>
  <label for="npw">الباسورد الجديد (6 حروف على الأقل)</label>
  <input class="f" id="npw" type="password" autocomplete="off">

</dialog>

<dialog id="viewer">
  <h4 id="vt"></h4><div id="vb"></div>
  <div class="acts"><button class="btn" data-close>إغلاق</button></div>
</dialog>

<div class="toast" id="toast" hidden></div>

<script id="data" type="application/json">{"salt":"mth-s1","user":"mostafaboraey","pw":"604e1c088b344fea1b2699878f123cf13241450d67d9c2183d328760accf6bc8","years":{"math1":{"title":"Math 1","sub":"السنة الأولى","glyph":"∑","items":[{"id":"a1","week":"السكشن 1","type":"video","title":"شرح الدوال والنهايات","url":"https://youtube.com"},{"id":"a2","week":"السكشن 1","type":"pdf","title":"ملزمة السكشن الأول","url":"https://example.com/sec1.pdf"},{"id":"a3","week":"السكشن 2","type":"link","title":"تمارين تفاعلية على GeoGebra","url":"https://www.geogebra.org"}]},"math2":{"title":"Math 2","sub":"السنة الثانية","glyph":"∫","items":[{"id":"b1","week":"السكشن 1","type":"video","title":"مقدمة في التكامل","url":"https://youtube.com"}]},"math3":{"title":"Math 3","sub":"السنة الثالثة","glyph":"∂","items":[{"id":"c1","week":"السكشن 1","type":"link","title":"حاسبة المصفوفات","url":"https://www.wolframalpha.com"}]}}}</script>
<script>
var DATA=JSON.parse(document.getElementById("data").textContent);
var root=document.documentElement,sb=null;
var $=function(i){return document.getElementById(i)};
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
if(CONFIG.SUPABASE_URL&&CONFIG.SUPABASE_ANON_KEY&&window.supabase){sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY)}
var TYPES={all:["الكل",""],video:["فيديوهات","▶"],pdf:["ملفات PDF","📄"],image:["صور","🖼️"],link:["لينكات","🔗"]};
var CTA={video:"شاهد",pdf:"افتح الملف",link:"افتح اللينك",image:"اعرض"};
var cur=null,fType="all",fWeek="all",fq="",admin=false,editId=null,tt;
try{admin=!sb&&sessionStorage.getItem("adm")==="1"}catch(e){}
$("fnote").textContent=sb?"أقصى حجم للملف "+CONFIG.MAX_MB+" ميجا. الفيديوهات الأكبر ارفعها على يوتيوب أو درايف وحط الرابط.":"رفع الملفات بيشتغل بعد ربط Supabase. لحد ما تربطه استخدم الروابط.";

function toast(m,bad){var t=$("toast");t.textContent=m;t.style.background=bad?"var(--danger)":"";t.style.color=bad?"#fff":"";t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},2600)}

/* الثيم */
function isDark(){var t=root.getAttribute("data-theme");return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches}
function paintTheme(){$("theme").textContent=isDark()?"☀️":"🌙"}
try{var st=localStorage.getItem("theme");if(st)root.setAttribute("data-theme",st)}catch(e){}
$("theme").onclick=function(){var n=isDark()?"light":"dark";root.setAttribute("data-theme",n);try{localStorage.setItem("theme",n)}catch(e){}paintTheme()};
paintTheme();

/* التحميل والحفظ */
async function load(){
  try{
    if(sb){var r=await sb.from("site").select("data").eq("id",1).maybeSingle();if(r.data&&r.data.data&&r.data.data.years)DATA.years=r.data.data.years}
    else{var s=localStorage.getItem("mathsite-data");if(s)DATA=JSON.parse(s)}
  }catch(e){}
  if(sb){try{var g=await sb.auth.getSession();if(g.data&&g.data.session)admin=true}catch(e){}}
  renderAll();route();
}
async function save(){
  try{
    if(sb){var r=await sb.from("site").upsert({id:1,data:{years:DATA.years}});if(r.error)throw r.error}
    else localStorage.setItem("mathsite-data",JSON.stringify(DATA));
    toast("تم الحفظ ✓");
  }catch(e){toast("فشل الحفظ: "+((e&&e.message)||"تأكد من الاتصال وتسجيل الدخول"),true)}
}

function renderHome(){
  $("years").innerHTML=Object.keys(DATA.years).map(function(k){var d=DATA.years[k];
    return '<button class="year" data-k="'+k+'"><span class="g">'+d.glyph+'</span><b>'+d.title+'</b><small>'+d.sub+' · '+d.items.length+' ملف</small></button>'}).join("");
}
$("years").onclick=function(e){var b=e.target.closest(".year");if(b)location.hash=b.dataset.k};
$("back").onclick=function(){location.hash="";route()};
function chips(el,pairs,active,attr){
  el.innerHTML=pairs.map(function(p){return '<button class="chip" '+attr+'="'+esc(p[0])+'" aria-pressed="'+(p[0]===active)+'">'+esc(p[1])+'</button>'}).join("")}

function render(){
  var d=DATA.years[cur];
  chips($("types"),Object.keys(TYPES).map(function(k){return [k,TYPES[k][0]]}),fType,"data-t");
  var weeks=[];d.items.forEach(function(i){if(weeks.indexOf(i.week)<0)weeks.push(i.week)});
  chips($("weeks"),[["all","كل السكاشن"]].concat(weeks.map(function(w){return [w,w]})),fWeek,"data-w");
  var items=d.items.filter(function(i){
    return (fType==="all"||i.type===fType)&&(fWeek==="all"||i.week===fWeek)&&(!fq||i.title.toLowerCase().indexOf(fq)>-1)});
  if(!items.length){$("list").innerHTML='<div class="empty">مفيش محتوى هنا لسه. جرّب تغيّر الفلتر أو ارجع بعدين.</div>';return}
  var html="";
  weeks.forEach(function(w){
    var g=items.filter(function(i){return i.week===w});if(!g.length)return;
    html+='<section class="group"><h3>'+esc(w)+'</h3>'+g.map(function(i){
      var inner='<span class="badge">'+TYPES[i.type][1]+'</span><span class="t">'+esc(i.title)+'<br><span class="k">'+TYPES[i.type][0]+'</span></span><span class="go">'+CTA[i.type]+'</span>';
      var main=(i.up&&(i.type==="video"||i.type==="image"))
        ? '<button class="item k-'+i.type+'" data-view="'+i.id+'">'+inner+'</button>'
        : '<a class="item k-'+i.type+'" href="'+esc(i.url)+'" target="_blank" rel="noopener noreferrer">'+inner+'</a>';
      var ad=admin?'<button class="sq" data-edit="'+i.id+'" aria-label="تعديل">✏️</button><button class="sq" data-del="'+i.id+'" aria-label="حذف">🗑️</button>':'';
      return '<div class="row">'+main+ad+'</div>'}).join("")+'</section>'});
  $("list").innerHTML=html;
}
$("types").onclick=function(e){var b=e.target.closest("[data-t]");if(b){fType=b.dataset.t;render()}};
$("weeks").onclick=function(e){var b=e.target.closest("[data-w]");if(b){fWeek=b.dataset.w;render()}};
$("q").oninput=function(){fq=this.value.trim().toLowerCase();render()};

function findItem(id){var r=null;Object.keys(DATA.years).forEach(function(k){DATA.years[k].items.forEach(function(i){if(i.id===id)r={y:k,i:i}})});return r}
$("list").onclick=function(e){
  var v=e.target.closest("[data-view]"),ed=e.target.closest("[data-edit]"),dl=e.target.closest("[data-del]");
  if(v){var f=findItem(v.dataset.view).i;$("vt").textContent=f.title;
    $("vb").innerHTML=f.type==="video"?'<video controls playsinline preload="metadata" src="'+esc(f.url)+'"></video>':'<img alt="'+esc(f.title)+'" src="'+esc(f.url)+'">';
    $("viewer").showModal()}
  if(ed)openItem(ed.dataset.edit);
  if(dl&&confirm("متأكد إنك عايز تحذف العنصر ده؟")){var r=findItem(dl.dataset.del);DATA.years[r.y].items=DATA.years[r.y].items.filter(function(i){return i.id!==r.i.id});renderAll();save()}
};
$("viewer").addEventListener("close",function(){$("vb").innerHTML=""});

function route(){
  var k=location.hash.replace("#","");
  if(DATA.years[k]){
    cur=k;fType="all";fWeek="all";fq="";$("q").value="";
    var d=DATA.years[k];$("yg").textContent=d.glyph;$("yt").textContent=d.title;$("ys").textContent=d.sub;
    $("home").hidden=true;$("year").hidden=false;render();
  }else{cur=null;$("year").hidden=true;$("home").hidden=false}
  window.scrollTo(0,0);
}
function paintAdmin(){$("adm").hidden=!admin;$("lock").textContent=admin?"🔓":"🔒"}
function renderAll(){renderHome();if(cur)render();paintAdmin()}
window.addEventListener("hashchange",route);

/* ====== المشرف ====== */
document.addEventListener("click",function(e){var c=e.target.closest("[data-close]");if(c)c.closest("dialog").close()});
function toEmail(u){u=u.trim().toLowerCase();return u.indexOf("@")>-1?u:u+"@example.com"}
function hex(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ("0"+x.toString(16)).slice(-2)}).join("")}
async function hashPw(p){return hex(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(DATA.salt+p)))}
$("lock").onclick=function(){if(admin)return;$("lpw").value="";$("lmsg").textContent="";$("dLogin").showModal()};
$("lok").onclick=async function(){
  $("lmsg").textContent="";
  try{
    if(sb){var r=await sb.auth.signInWithPassword({email:toEmail($("lem").value),password:$("lpw").value});
      if(r.error){$("lmsg").textContent="اسم المستخدم أو الباسورد غلط.";return}admin=true}
    else{if($("lem").value.trim().toLowerCase()!==DATA.user||await hashPw($("lpw").value)!==DATA.pw){$("lmsg").textContent="اسم المستخدم أو الباسورد غلط.";return}admin=true;try{sessionStorage.setItem("adm","1")}catch(e){}}
    $("dLogin").close();renderAll();
  }catch(e){$("lmsg").textContent="حصلت مشكلة. حاول تاني."}
};
$("lpw").onkeydown=function(e){if(e.key==="Enter")$("lok").click()};
$("outBtn").onclick=function(){admin=false;try{sessionStorage.removeItem("adm")}catch(e){}if(sb)sb.auth.signOut();renderAll()};
$("pwBtn").onclick=function(){$("npw").value="";$("pmsg").textContent="";$("dPw").showModal()};
$("pok").onclick=async function(){
  var p=$("npw").value;if(p.length<6){$("pmsg").textContent="الباسورد لازم يكون 6 حروف على الأقل.";return}
  try{
    if(sb){var r=await sb.auth.updateUser({password:p});if(r.error)throw r.error}
    else{DATA.pw=await hashPw(p);await save()}
    $("dPw").close();toast("تم تغيير الباسورد ✓");
  }catch(e){$("pmsg").textContent="تعذر تغيير الباسورد."}
};

function openItem(id){
  editId=id||null;var r=id?findItem(id):null;
  $("iYear").innerHTML=Object.keys(DATA.years).map(function(k){return '<option value="'+k+'">'+DATA.years[k].title+' - '+DATA.years[k].sub+'</option>'}).join("");
  $("iYear").value=r?r.y:(cur||"math1");
  $("dTitle").textContent=r?"تعديل المحتوى":"إضافة محتوى";
  $("iWeek").value=r?r.i.week:"";$("iTitle").value=r?r.i.title:"";$("iType").value=r?r.i.type:"video";
  $("iUrl").value=r?r.i.url:"";$("iFile").value="";$("imsg").textContent="";
  fillWeeks();$("dItem").showModal();
}
function fillWeeks(){var d=DATA.years[$("iYear").value],w=[];d.items.forEach(function(i){if(w.indexOf(i.week)<0)w.push(i.week)});$("wl").innerHTML=w.map(function(x){return '<option value="'+esc(x)+'">'}).join("")}
$("iYear").onchange=fillWeeks;
$("addBtn").onclick=function(){openItem()};
$("iFile").onchange=function(){var f=this.files[0];if(!f)return;
  $("iType").value=f.type.indexOf("video")===0?"video":f.type.indexOf("image")===0?"image":f.type==="application/pdf"?"pdf":$("iType").value;
  if(!$("iTitle").value)$("iTitle").value=f.name.replace(/\.[^.]+$/,"")};
function msg(t){$("imsg").textContent=t}
$("iok").onclick=async function(){
  var y=$("iYear").value,w=$("iWeek").value.trim(),t=$("iTitle").value.trim(),type=$("iType").value,url=$("iUrl").value.trim(),f=$("iFile").files[0],up=false;
  if(!w||!t){msg("اكتب اسم السكشن وعنوان المحتوى.");return}
  var old=editId?findItem(editId):null;
  if(f){
    if(!sb){msg("رفع الملفات محتاج ربط Supabase. استخدم رابط دلوقتي.");return}
    if(f.size>CONFIG.MAX_MB*1048576){msg("الملف أكبر من "+CONFIG.MAX_MB+" ميجا. ارفعه على يوتيوب أو درايف وحط الرابط.");return}
    try{
      msg("جاري الرفع... استنى لحظات");
      var ext=(f.name.match(/\.[A-Za-z0-9]+$/)||[""])[0].toLowerCase(),path=Date.now()+"-"+Math.random().toString(36).slice(2,7)+ext;
      var u=await sb.storage.from(CONFIG.BUCKET).upload(path,f,{contentType:f.type||undefined});
      if(u.error)throw u.error;
      url=sb.storage.from(CONFIG.BUCKET).getPublicUrl(path).data.publicUrl;up=true;msg("");
    }catch(e){msg("فشل الرفع: "+((e&&e.message)||"حاول تاني"));return}
  }else if(old&&old.i.up&&url===old.i.url){up=true}
  if(!url){msg("حط رابط أو اختار ملف.");return}
  if(!/^https?:\/\//i.test(url)){msg("الرابط لازم يبدأ بـ https://");return}
  var item={id:editId||("i"+Date.now().toString(36)+Math.random().toString(36).slice(2,5)),week:w,type:type,title:t,url:url};
  if(up)item.up=true;
  if(old){DATA.years[old.y].items=DATA.years[old.y].items.filter(function(i){return i.id!==editId})}
  DATA.years[y].items.push(item);
  $("dItem").close();renderAll();save();
};
load();
</script>
</body>
